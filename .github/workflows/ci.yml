name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: cd server && npm install

      - name: Run backend tests
        run: cd server && npm test
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/ci_test
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_key_minimum_32_chars
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_minimum_32_chars
          CLIENT_ORIGINS: http://localhost:5173

